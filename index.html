<!doctype html>
<html lang="ur">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live TV - Pakistan & India</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #e8eefc; }
    header { padding: 16px 20px; background: #121a33; border-bottom: 1px solid #23305a; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { margin: 0; font-size: 20px; }
    button { padding: 10px 14px; border: 0; border-radius: 10px; background: #3b82f6; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .wrap { padding: 16px; max-width: 1200px; margin: auto; }
    .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    .card { background: #121a33; border: 1px solid #23305a; border-radius: 14px; overflow: hidden; }
    video { width: 100%; aspect-ratio: 16/9; background: black; display: block; }
    #status { padding: 10px 12px; font-size: 13px; color: #9fb0d9; min-height: 40px; }
    .list-head { padding: 12px; border-bottom: 1px solid #23305a; display: flex; }
    .list-head input { flex: 1; padding: 10px; border-radius: 9px; border: 1px solid #2d3b6b; background: #111936; color: white; outline: none; }
    #channels { max-height: 560px; overflow: auto; padding: 8px; }
    
    /* کیٹیگری لیبل کے لیے */
    .group-label { font-size: 13px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; color: #7d90be; padding: 12px 8px 6px; border-bottom: 1px solid #23305a; margin-bottom: 6px; }
    
    .channel { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 6px; border: 1px solid transparent; border-radius: 10px; background: #0f1730; color: white; cursor: pointer; text-align: left; }
    .channel:hover { border-color: #3b82f6; }
    .channel.active { border-color: #22c55e; background: #102a1c; }
    .channel img { width: 38px; height: 38px; object-fit: contain; border-radius: 6px; background: #000; flex-shrink: 0; }
    .channel .meta { min-width: 0; flex: 1; }
    .channel .name { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel .sub { display: block; font-size: 12px; color: #8fa3d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { padding: 20px; color: #8fa3d1; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>📺 Live TV</h1>
    <button id="reloadBtn">Reload Channels</button>
  </header>

  <div class="wrap">
    <div class="layout">
      <div class="card">
        <video id="video" controls playsinline></video>
        <div id="status">Channels load ho rahe hain...</div>
      </div>
      <div class="card">
        <div class="list-head">
          <input id="search" placeholder="Search channel..." />
        </div>
        <div id="channels"><div class="empty">Loading...</div></div>
      </div>
    </div>
  </div>

  <script>
    const PROXY = '/api/proxy?url=';
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const channelsEl = document.getElementById('channels');
    const searchInput = document.getElementById('search');
    const reloadBtn = document.getElementById('reloadBtn');

    let hls = null;
    let channels = [];
    let activeUrl = '';

    function proxyUrl(url) { return PROXY + encodeURIComponent(url); }
    function setStatus(msg) { statusEl.textContent = msg; }

    function destroyPlayer() {
      if (hls) { hls.destroy(); hls = null; }
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    function playUrl(url, name = '') {
      if (!url) {
        setStatus(`❌ ${name} ka stream link available nahi hai.`);
        return;
      }

      destroyPlayer();
      activeUrl = url;
      setStatus(`Loading: ${name}`);
      const src = proxyUrl(url);

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(src);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          setStatus(`▶️ Playing: ${name}`);
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) setStatus(`❌ Error: ${data.type}`);
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = src;
        video.play().catch(() => {});
        setStatus(`▶️ Playing: ${name}`);
      }
      renderChannels();
    }

    function renderChannels() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = channels.filter(c => !q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
      
      channelsEl.innerHTML = '';
      if (!filtered.length) {
        channelsEl.innerHTML = '<div class="empty">Koi channel nahi mila.</div>';
        return;
      }

      // چینلز کو کیٹیگری کے حساب سے گروپ کریں
      const grouped = {};
      filtered.forEach(ch => {
        const cat = ch.category ? ch.category.toUpperCase() : 'OTHER';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(ch);
      });

      Object.keys(grouped).forEach(category => {
        const label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = `${category} (${grouped[category].length})`;
        channelsEl.appendChild(label);

        grouped[category].forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'channel' + (ch.streamUrl === activeUrl ? ' active' : '');
          btn.type = 'button';
          
          if (ch.logo) {
            const img = document.createElement('img');
            img.src = ch.logo;
            img.loading = 'lazy';
            img.onerror = () => img.remove();
            btn.appendChild(img);
          }

          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.innerHTML = `<span class="name">${ch.name}</span><span class="sub">${ch.category || 'Live TV'}</span>`;
          btn.appendChild(meta);
          
          btn.onclick = () => playUrl(ch.streamUrl, ch.name);
          channelsEl.appendChild(btn);
        });
      });
    }

    async function loadChannels() {
      reloadBtn.disabled = true;
      setStatus('Channels fetch ho rahe hain...');
      try {
        const res = await fetch('/api/channels');
        if (!res.ok) throw new Error('API Error');
        
        const data = await res.json();
        channels = data.channels || [];

        if (!channels.length) throw new Error('No channels found');

        renderChannels();
        setStatus(`✅ ${channels.length} channels mil gaye. Kisi bhi channel par click karein.`);
        reloadBtn.disabled = false;
      } catch (err) {
        setStatus(`❌ Error: ${err.message}`);
        reloadBtn.disabled = false;
      }
    }

    searchInput.oninput = renderChannels;
    reloadBtn.onclick = loadChannels;
    loadChannels();
  </script>
</body>
</html>
